<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蟹堡王小店長島嶼導覽</title>
<style>:root{--sea:#1b8fc4;--sand:#fff3cf;--ink:#16324a;--krab:#e8512f;--gold:#f5b82e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#9adcf4;color-scheme:light;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);overflow:hidden}
#stage{position:fixed;top:0;bottom:0;left:340px;right:0;touch-action:none}
#stage canvas{display:block}
#panel{position:fixed;top:0;bottom:0;left:0;width:340px;background:var(--sand);border-right:6px solid var(--krab);display:flex;flex-direction:column;z-index:5}
#handle{display:none}
header{padding:18px 18px 12px;border-bottom:3px dashed #e2c97a}
h1{margin:0 0 4px;font-size:1.25rem;line-height:1.3}
#sub{margin:0 0 10px;font-size:.9rem;line-height:1.5;color:#4a6378}
#sub:empty{display:none}
#q{width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;font:inherit;background:#fff}
#q[hidden],#back[hidden]{display:none}
#back{border:0;background:var(--krab);color:#fff;font:inherit;font-weight:700;padding:7px 14px;border-radius:999px;margin-bottom:10px;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,li:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
#list{list-style:none;margin:0;padding:10px;overflow:auto;flex:1}
#list li{padding:10px 12px;margin-bottom:8px;background:#fff;border:2px solid var(--ink);border-radius:12px;cursor:pointer;transition:transform .15s,background .15s}
#list li:hover{background:#fff9e3;transform:translateX(3px)}
#list li b{display:inline-block;min-width:2.2em;color:var(--krab)}
#list li small{display:block;margin-top:3px;color:#4a6378;line-height:1.45}
#list a,#list .art{display:block;text-decoration:none;color:inherit}
#list .art strong{display:block}
#list .empty{background:none;border:0;cursor:default;color:#4a6378}
.tag{padding:4px 11px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;pointer-events:auto;transition:background .2s}
.tag.on,.tag:hover{background:var(--krab);color:#fff}
@media(max-width:700px){
 #stage{left:0}
 #panel{top:auto;left:0;right:0;width:auto;height:58vh;border-right:0;border-top:6px solid var(--krab);border-radius:18px 18px 0 0;transform:translateY(calc(100% - 52px));transition:transform .35s ease}
 #panel.open{transform:none}
 #handle{display:block;height:52px;border:0;background:none;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
 header{padding:6px 14px 10px}
}
@media(prefers-reduced-motion:reduce){#panel,#list li{transition:none}}
/* ---- 進島視窗（參考成語分鏡的分鏡舞台） ---- */
#modal{position:fixed;top:0;bottom:0;left:340px;right:0;z-index:9;background:rgba(10,30,50,.55);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.box{width:min(780px,100%);max-height:100%;overflow:auto;background:var(--sand);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar b{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:1.2rem;flex:1}
.bar #x{border:2px solid var(--ink);background:#fff;border-radius:8px;width:40px;height:40px;font-size:1rem;cursor:pointer}
.stage{position:relative;aspect-ratio:16/10;border:3px solid var(--ink);border-radius:6px;overflow:hidden;container-type:inline-size;box-shadow:4px 4px 0 var(--ink)}
.actor{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--s)*1cqw);line-height:1}
.actor img{width:calc(var(--s)*1.5cqw);display:block}
.a-bounce{animation:bn .5s ease-in-out 3}
@keyframes bn{50%{transform:translate(-50%,-62%)}}
#cap{position:absolute;left:2cqw;top:2cqw;max-width:72%;background:#fffdf5;border:.4cqw solid var(--ink);padding:1cqw 1.8cqw;font-weight:700;font-size:max(13px,3cqw);line-height:1.5}
#cap:empty{display:none}
#bub{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);max-width:88%;background:#fff;border:.4cqw solid var(--ink);border-radius:2cqw;padding:1cqw 2cqw;font-weight:700;font-size:max(13px,3.2cqw);text-align:center}
.sp{position:absolute;font-size:4cqw;animation:sp 1.2s both;pointer-events:none}
@keyframes sp{0%{transform:scale(0)}40%{transform:scale(1.3) rotate(30deg)}100%{transform:translateY(-8cqw) scale(.6);opacity:0}}
.bg-shop{background:repeating-linear-gradient(90deg,#d8473c 0 6cqw,#fff 6cqw 12cqw) 0 0/100% 12% no-repeat,linear-gradient(#ffe7c2 0 72%,#9b6a45 72%)}
.bg-lobby{background:linear-gradient(#bfe6f5 0 70%,#f1d9a6 70%)}
.bg-sea{background:linear-gradient(#a9dcf6 0 50%,#3f8fc9 50% 74%,#f1d9a6 74%)}
.bg-shelf{background:linear-gradient(#fbeedd 0 74%,#b97d52 74%)}
.bg-stage{background:radial-gradient(ellipse at 50% 85%,rgba(255,240,180,.85) 0 24cqw,transparent 34cqw),linear-gradient(90deg,#8d1d26 0 12%,#3b1f2b 12% 88%,#8d1d26 88%)}
#ui{margin-top:12px;display:grid;gap:10px}
#ui h3{margin:0;font-size:1.1rem;line-height:1.5}
.tip{margin:0;font-size:.9rem;color:#4a6378}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-align:left}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--krab);color:#fff;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.right{background:#ddf1eb;border-color:#1f7a68}
.opt.wrong{background:#fbe7e5;border-color:var(--krab);animation:shk .3s 2}
.opt:disabled{opacity:1}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row{display:flex;gap:10px}
#in{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;font:inherit;font-size:1.1rem}
#in.wrong{border-color:var(--krab);animation:shk .3s 2}
.got{margin:0;color:#1f7a68;font-weight:700}
.fin{text-align:center;padding:6px 0}
.stage.mini{width:min(100%,280px);margin:0 auto}
.stamp{display:inline-block;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:900;font-size:2rem;color:var(--krab);border:4px solid var(--krab);border-radius:10px;padding:4px 18px;transform:rotate(-3deg)}
#list li.go{background:var(--krab);color:#fff;border-color:var(--ink);font-weight:700;text-align:center;font-size:1.05rem}
#list li.go:hover{background:#d0421f}
@media(max-width:700px){#modal{left:0;padding:0}.box{height:100%;border-radius:0;border-width:0;box-shadow:none;width:100%}.opts{grid-template-columns:1fr}}
.qimg{width:100%;max-height:min(60vh,520px);object-fit:contain;border:3px solid var(--ink);border-radius:8px;background:#fff;justify-self:center}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--ink);margin-bottom:10px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid #e2c97a;text-align:left}
.tbl .sum td{font-weight:900;background:#fff3cf;font-size:1.1rem}
.cert{margin-top:6px;text-align:center;background:#fffdf5;border:5px double var(--krab);border-radius:12px;padding:18px 12px}
.cert h2{margin:4px 0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:2.2rem;color:var(--krab)}
.cert .nm{font-size:1.8rem;font-weight:900;border-bottom:2px solid var(--ink);display:inline-block;min-width:60%;margin:8px 0}
.cert p{margin:6px 0}
.rec{display:grid;gap:8px}.rec audio{width:100%}
#me{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;font-size:.9rem}
#me button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 10px;font:inherit;cursor:pointer}
#login{position:fixed;top:0;bottom:0;left:0;right:0;z-index:20;background:rgba(10,30,50,.7);display:grid;place-items:center;padding:16px}
#login form{width:min(420px,100%);display:grid;gap:10px;background:var(--sand);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:18px}
#login h2,#login p{margin:0}
#login input{padding:12px;border:2px solid var(--ink);border-radius:10px;font:inherit;font-size:1.1rem}
.qimg.card{max-height:min(46vh,430px)}
.say{margin:0;font-weight:700;padding:8px 12px;background:#fff;border:2px solid var(--ink);border-radius:10px}

@media(max-width:700px){#panel{padding-bottom:env(safe-area-inset-bottom,0px)}}
#modal{padding-top:max(16px,env(safe-area-inset-top,0px))}
</style>

</aside>

const API=window.KK_API||'';
const WK='kk-who',QK='kk-q', JH={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'}};
const getWho=()=>{try{return JSON.parse(localStorage.getItem(WK)||'null')}catch(e){return null}};
const setWho=w=>{try{w?localStorage.setItem(WK,JSON.stringify(w)):localStorage.removeItem(WK)}catch(e){}};
let busy=false;
async function flush(){
  if(!API||busy)return; busy=true; let q=[]; try{q=JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){}
  const keep=[]; for(const p of q){try{const j=await (await fetch(API,{...JH,body:JSON.stringify(p)})).json(); if(!j.ok&&j.err!=='bad')keep.push(p)}catch(e){keep.push(p)}}
  try{localStorage.setItem(QK,JSON.stringify(keep))}catch(e){} busy=false;
}
function send(p){
  const w=getWho(); if(!API||!w)return; let q=[]; try{q=JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){}
  q.push({...w,...p}); try{localStorage.setItem(QK,JSON.stringify(q.slice(-60)))}catch(e){} flush();
}
addEventListener('online',flush);
function loginUI(onOk){
  const d=document.createElement('div'); d.id='login';
  d.innerHTML='<form><h2>🦀 蟹堡王小店長</h2><p>請輸入你的座號或組別。</p><input id="li" placeholder="座號或組別（例如 12 或 第3組）" maxlength="8" aria-label="座號或組別"><p class="tip" id="le"></p><button class="btn go" type="submit">開始</button></form>';
  document.body.append(d);
  d.querySelector('form').onsubmit=e=>{
    e.preventDefault(); const id=d.querySelector('#li').value.trim(), le=d.querySelector('#le');
    if(!id){le.textContent='請先填寫座號或組別喔。';return}
    setWho({code:'all',id}); d.remove(); onOk&&onOk();
  };
}

const sh=a=>[...a].sort(()=>Math.random()-.5);
const speak=t=>{const ss=window.speechSynthesis; if(!ss)return; const go=()=>{const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85; const vs=ss.getVoices(), v=vs.find(x=>/^en[-_]US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang)); if(v)u.voice=v; ss.resume(); ss.speak(u)}; if(ss.speaking||ss.pending){ss.cancel(); setTimeout(go,120)} else go()};
const spark=(st,e='✨')=>{for(let k=0;k<7;k++){const s=document.createElement('span');s.className='sp';s.textContent=e;s.style.cssText=`left:${10+Math.random()*80}%;top:${20+Math.random()*50}%`;st.append(s);setTimeout(()=>s.remove(),1200)}};
const btn=(t,c='')=>{const b=document.createElement('button');b.className='btn '+c;b.textContent=t;return b};
function openScene(id,done){
  const sc=SCENES[id], m=$('#modal'), n=sc.s.length; let i=0,hit=0,tot=0,mr=null,rc=0; const sp=new Set(); const log=o=>{if(id==='06')send({t:'ans',island:6,step:i,kind:sc.s[i][0],tries:0,...o})};
  m.hidden=false; send({t:'open',island:+id});
  m.innerHTML=`<div class="box"><div class="bar"><b>${sc.title}</b><span id="pg"></span><button id="x" aria-label="關閉">✕</button></div><div class="stage bg-${sc.bg}">${Object.entries(sc.who).map(([k,v])=>{const [c,p]=v.split('@'),[x,y,s]=p.split(','),im=CHARS[c][1];return `<div class="actor" id="ac-${k}" style="left:${x}%;top:${y}%;--s:${s}">${im?`<img src="${im}" alt="">`:CHARS[c][0]}</div>`}).join('')}<div id="cap"></div><div id="bub" hidden></div></div><div id="ui"></div></div>`;
  const close=()=>{speechSynthesis.cancel(); if(mr&&mr.state==='recording')mr.stop();m.hidden=true;m.innerHTML=''};
  $('#x').onclick=close; document.onkeydown=e=>{if(e.key==='Escape'&&!m.hidden)close()};
  const st=$('.stage'),ui=$('#ui'),cap=$('#cap'),bub=$('#bub'),act=$('#ac-a');
  function recUI(){

      const go=()=>d.id==='07'?openAward(data,prog,rat,W):openScene(d.id,(s,r)=>{prog[d.id]=Math.max(prog[d.id]||0,s); rat[d.id]=Math.max(rat[d.id]||0,r); try{localStorage.setItem('kk-prog',JSON.stringify(prog));localStorage.setItem('kk-rat',JSON.stringify(rat))}catch(e){} render();});
      li.onclick=go; li.onkeydown=e=>{if(e.key==='Enter')go()}; ul.append(li); return;}
    (d.items||[]).forEach(a=>{const li=document.createElement('li'), ok=a.url&&a.url!=='#', h=`<strong>${esc(a.title)}</strong><small>${esc(a.desc||'')}</small>`;
      li.style.cursor=ok?'pointer':'default'; li.innerHTML=ok?`<a href="${esc(a.url)}" target="_blank" rel="noopener">${h}</a>`:`<div class="art">${h}</div>`; ul.append(li);});
    if(!d.items?.length)ul.innerHTML='<li class="empty">這座島還沒有文章。</li>';
  }
}
function me(){
  const w=getWho(), el=$('#me'); el.innerHTML='';
  if(API&&w){const s=document.createElement('span'), b=document.createElement('button'); s.textContent=`👤 ${w.id}`; b.textContent='換人'; b.onclick=()=>{setWho(null);loginUI(me)}; el.append(s,b)}
  const r=document.createElement('button'); r.textContent='↻ 重新開始';
  r.onclick=()=>{if(!confirm('要清除這支手機上的星星與進度，重新開始嗎？\n（老師端記錄的最佳成績不會被清除）'))return; prog={};rat={}; try{localStorage.removeItem('kk-prog');localStorage.removeItem('kk-rat')}catch(e){} render()}; el.append(r);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#back').onclick=home; $('#q').oninput=render; $('#handle').onclick=()=>panel.classList.toggle('open');
const ray=new THREE.Raycaster(), v=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return; const r=renderer.domElement.getBoundingClientRect();
  v.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(v,camera);
  const h=ray.intersectObjects(hits,false)[0]; if(h)select(h.object.userData.i);
});
function resize(){const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); lr.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=clock.getDelta(), t=clock.elapsedTime;
  if(fly){fly.t=Math.min(1,fly.t+dt/1.3); const k=fly.t, e=k<.5?4*k**3:1-(-2*k+2)**3/2; controls.target.lerpVectors(fly.ft,fly.tt,e); camera.position.lerpVectors(fly.fp,fly.tp,e); if(k>=1)fly=null;}
  for(let i=0;i<sp.count;i++){const x=sb[i*3],z=sb[i*3+2]; sp.setY(i,Math.sin(x*.25+t)*.18+Math.cos(z*.2+t*.8)*.18);} sp.needsUpdate=true;
  islands.forEach(o=>o.g.position.y=o.base+Math.sin(t*.8+o.ph)*.12);
  walkers.forEach(w=>{w.t-=dt; if(w.t<0){w.t=3+Math.random()*4; if(Math.random()<.5)w.pause=1+Math.random()*2; else w.dir*=-1}
    const mv=w.pause>0?0:1; if(mv)w.ang+=w.dir*w.spd*dt; else w.pause-=dt;
    w.p.position.set(Math.cos(w.ang)*w.r,.9+(mv?Math.abs(Math.sin(t*9+w.ph))*.05:0),Math.sin(w.ang)*w.r);
    w.p.rotation.y=Math.atan2(-Math.sin(w.ang)*w.dir,Math.cos(w.ang)*w.dir);});
  controls.update(); renderer.render(scene,camera); lr.render(scene,camera);
});
Promise.resolve(DATA).then(j=>{
  data=j.islands; const n=data.length-1;
  data.forEach((d,i)=>{const a=i/n*Math.PI*2-Math.PI/2, R=17+Math.max(0,n-8)*1.6, pos=i<n?new THREE.Vector3(Math.cos(a)*R,0,Math.sin(a)*R):new THREE.Vector3(); islands.push(makeIsland(d,i,pos,i<n?1:1.8));});
  for(let i=0;i<n;i++){bridge(islands[n],islands[i]); bridge(islands[i],islands[(i+1)%n]);}
  render(); me(); if(API&&!getWho())loginUI(me);
}).catch(()=>{$('#sub').textContent='讀不到 islands.json。請用本機伺服器開啟（例如在 island 資料夾執行 python3 -m http.server），不要直接雙擊 index.html。';});

</script>
