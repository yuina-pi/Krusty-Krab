    const li=document.createElement('li'); li.className='go'; li.tabIndex=0; li.textContent='🏆 開啟排行榜'; li.onclick=openBoard; ul.append(li);
  } else {
    const d=data[cur]; $('#ttl').textContent=`${d.id} ${d.name}`; $('#sub').textContent=d.blurb||'';
    summary(ul,cur+1); if(cur===5)questionCards(ul);
  }
  ul.scrollTop=top;
}
const setSt=t=>{$('#st').textContent=t};
async function pull(){
  if(!API)return setSt('尚未設定 config.js 的網址');
  try{
    const j=await (await fetch(API+'?pass='+encodeURIComponent(pass))).json();
    if(!j.ok){setSt('密碼錯誤，或後台尚未部署'); sessionStorage.removeItem('kk-pw'); clearInterval(timer); pass=''; return askPass()}
    PL=j.rows||[]; ANS=j.answers||[]; LAST={}; ANS.forEach(a=>{LAST[a[1]]=Math.max(LAST[a[1]]||0,+a[0])});
    setSt('已更新 '+new Date().toLocaleTimeString('zh-TW')); render();
  }catch(e){setSt('連線失敗，稍後自動重試')}
}
function askPass(){
  if($('#login'))return; const d=document.createElement('div'); d.id='login';
  d.innerHTML='<form><h2>🦀 教師即時看板</h2><p>請輸入教師密碼。</p><input type="password" aria-label="教師密碼" placeholder="教師密碼"><button class="btn go" type="submit">連線</button></form>';
  document.body.append(d); d.querySelector('input').focus();
  d.querySelector('form').onsubmit=e=>{e.preventDefault(); pass=d.querySelector('input').value; sessionStorage.setItem('kk-pw',pass); d.remove(); startLive()};
}
function startLive(){clearInterval(timer); if(!pass)return askPass(); pull(); timer=setInterval(pull,4000);}
$('#seat').onchange=e=>{showSeat=e.target.checked; render()};
/* ---- 排行榜（仿 Kahoot 揭曉） ---- */
let AC; const sleep=ms=>new Promise(r=>setTimeout(r,ms)), ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,t,d,type='triangle',g=.2){const a=ac(),o=a.createOscillator(),v=a.createGain(); o.type=type; o.frequency.value=f; v.gain.setValueAtTime(g,a.currentTime+t); v.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d); o.connect(v).connect(a.destination); o.start(a.currentTime+t); o.stop(a.currentTime+t+d+.02)}
async function drum(sec){for(let t=0;t<sec;t+=.09)tone(110+Math.random()*30,t,.08,'square',.1+t/sec*.12); await sleep(sec*1000)}
const ping=()=>{tone(660,0,.25);tone(880,.12,.3)}, fanfare=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.14,.5,'triangle',.25)); tone(1047,.6,.9,'triangle',.25)};
function confetti(){for(let k=0;k<44;k++){const s=document.createElement('span'); s.className='cf'; s.textContent=['🎉','⭐','🦀','✨','🍔'][k%5]; s.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*1.2}s`; $('#lb').append(s); setTimeout(()=>s.remove(),4500)}}
const ranked=()=>PL.filter(r=>+r.total>0).sort((a,b)=>b.total-a.total||(a.doneAt||9e15)-(b.doneAt||9e15));
function openBoard(){
  const el=$('#lb'); el.hidden=false;
  el.innerHTML='<div class="lbx"><button id="lbc" aria-label="關閉">✕</button><h2>🏆 最佳小店長</h2><div id="pod"></div><ol id="lst"></ol><button id="rv" class="rv" type="button">▶ 揭曉</button></div>';
  $('#lbc').onclick=()=>{el.hidden=true}; $('#rv').onclick=reveal;
}
async function reveal(){
  const rs=ranked(), pod=$('#pod'), lst=$('#lst'), rv=$('#rv'); rv.hidden=true; pod.innerHTML=''; lst.innerHTML=''; $('#lb h2').textContent='🏆 最佳小店長';
  if(!rs.length){pod.textContent='還沒有人完成任何一座島。'; rv.hidden=false; return}
  const top=rs.slice(0,3), cols={};
  [1,0,2].forEach(i=>{if(!top[i])return; const c=document.createElement('div'); c.className='col r'+(i+1); c.innerHTML=`<div class="nm">？</div><div class="bar"><span>${i+1}</span></div>`; pod.append(c); cols[i]=c;});
  for(const i of [2,1,0]){
    if(!top[i])continue; await drum(i===0?3:1.6); const c=cols[i];
    c.querySelector('.nm').innerHTML=`${esc(top[i].id)}<small>${top[i].total} 分</small>`; c.classList.add('up');
    if(i===0){fanfare(); confetti()} else ping(); await sleep(i===0?1400:800);
  }
  $('#lb h2').textContent=`🏆 最佳小店長：${top[0].id}`;
  rs.slice(3,10).forEach((r,k)=>{const li=document.createElement('li'); li.style.animationDelay=k*.25+'s'; li.innerHTML=`<span>${k+4}　${esc(r.id)}</span><b>${r.total} 分</b>`; lst.append(li);});
  rv.textContent='↻ 再揭曉一次'; rv.hidden=false;
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#back').onclick=home; $('#handle').onclick=()=>panel.classList.toggle('open');
const ray=new THREE.Raycaster(), v=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return; const r=renderer.domElement.getBoundingClientRect();
  v.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(v,camera);
  const h=ray.intersectObjects(hits,false)[0]; if(h)select(h.object.userData.i);
});
function resize(){const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); lr.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=clock.getDelta(), t=clock.elapsedTime;
  if(fly){fly.t=Math.min(1,fly.t+dt/1.3); const k=fly.t, e=k<.5?4*k**3:1-(-2*k+2)**3/2; controls.target.lerpVectors(fly.ft,fly.tt,e); camera.position.lerpVectors(fly.fp,fly.tp,e); if(k>=1)fly=null;}
  for(let i=0;i<sp.count;i++){const x=sb[i*3],z=sb[i*3+2]; sp.setY(i,Math.sin(x*.25+t)*.18+Math.cos(z*.2+t*.8)*.18);} sp.needsUpdate=true;
  islands.forEach(o=>o.g.position.y=o.base+Math.sin(t*.8+o.ph)*.12);
  walkers.forEach(w=>{w.t-=dt; if(w.t<0){w.t=3+Math.random()*4; if(Math.random()<.5)w.pause=1+Math.random()*2; else w.dir*=-1}
    const mv=w.pause>0?0:1; if(mv)w.ang+=w.dir*w.spd*dt; else w.pause-=dt;
    w.p.position.set(Math.cos(w.ang)*w.r,.9+(mv?Math.abs(Math.sin(t*9+w.ph))*.05:0),Math.sin(w.ang)*w.r);
    w.p.rotation.y=Math.atan2(-Math.sin(w.ang)*w.dir,Math.cos(w.ang)*w.dir);});
  controls.update(); renderer.render(scene,camera); lr.render(scene,camera);
});
Promise.resolve(DATA).then(j=>{
  data=j.islands; const n=data.length-1;
  data.forEach((d,i)=>{const a=i/n*Math.PI*2-Math.PI/2, R=17+Math.max(0,n-8)*1.6, pos=i<n?new THREE.Vector3(Math.cos(a)*R,0,Math.sin(a)*R):new THREE.Vector3(); islands.push(makeIsland(d,i,pos,i<n?1:1.8));});
  for(let i=0;i<n;i++){bridge(islands[n],islands[i]); bridge(islands[i],islands[(i+1)%n]);}
  render(); startLive();
}).catch(()=>{$('#sub').textContent='讀不到 islands.json。請用本機伺服器開啟（例如在 island 資料夾執行 python3 -m http.server），不要直接雙擊 index.html。';});
